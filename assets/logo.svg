<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="pFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd7a8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#c07a72" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ede8df" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ede8df" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ede8df" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="32" fill="#0e0f12"/>

  <!-- Prism body -->
  <polygon points="100,30 185,195 15,195" fill="url(#pFill)" stroke="#ffd7a8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner refraction lines -->
  <line x1="72" y1="112" x2="130" y2="80" stroke="#ffd7a8" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="112" x2="135" y2="112" stroke="#5eead4" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="112" x2="130" y2="144" stroke="#c07a72" stroke-width="0.8" opacity="0.3"/>

  <!-- Incoming beam -->
  <line x1="0" y1="112" x2="72" y2="112" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Refracted beams -->
  <line x1="130" y1="80" x2="230" y2="35" stroke="#ffd7a8" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="135" y1="112" x2="235" y2="112" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="130" y1="144" x2="230" y2="189" stroke="#c07a72" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Trace dots along beams -->
  <circle cx="160" cy="66" r="2.5" fill="#ffd7a8" opacity="0.6"/>
  <circle cx="190" cy="50" r="2" fill="#ffd7a8" opacity="0.4"/>
  <circle cx="165" cy="112" r="2.5" fill="#5eead4" opacity="0.6"/>
  <circle cx="195" cy="112" r="2" fill="#5eead4" opacity="0.4"/>
  <circle cx="160" cy="158" r="2.5" fill="#c07a72" opacity="0.6"/>
  <circle cx="190" cy="174" r="2" fill="#c07a72" opacity="0.4"/>

  <!-- Refraction point -->
  <circle cx="72" cy="112" r="3" fill="#ede8df" opacity="0.8"/>
</svg>
