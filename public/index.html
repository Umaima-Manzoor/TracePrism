<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TracePrism - Runtime Code Visualizer</title>
    
    <!-- Google Fonts: Outfit (UI) & JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">     <!-- show text using default system font then swap to custom font once it loads -->
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <header class="topbar">     <!-- Top Command Bar -->
            <div class="brand">
                <span class="brand-name">TRACEPRISM</span>
                <span class="brand-divider">/</span>
                <span class="brand-sub">Python Runtime Visualizer</span>
            </div>
            <div class="topbar-actions">
                <button id="btn-trace" class="btn btn-primary">Run Trace</button>
            </div>
        </header>

        <!-- Main Workspace (Grid: Left Editor, Right Unified Canvas) -->
        <main class="workspace">
            <!-- Left Pane: Code Input & Line Stepper -->
            <section class="editor-pane">
                <div class="pane-header">
                    <span class="pane-title">source.py</span>
                    <span id="step-indicator" class="status-tag">READY</span>
                </div>
                <div class="editor-container">
                    <!-- Line Numbers Gutter -->
                    <div id="line-numbers" class="line-numbers">1</div>
                    <!-- Code Textarea -->
                    <textarea id="code-input" class="code-editor" spellcheck="false">def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

result = factorial(3)</textarea>
                    <!-- Visual Line Highlight Overlay -->
                    <div id="line-highlight" class="line-highlight"></div>
                </div>
            </section>

            <!-- Right Pane: Unified Adaptive Canvas (vars, stack, arrays, trees all render here) -->
            <section class="canvas-pane">
                <div class="pane-header">
                    <span class="pane-title">Execution State</span>
                    <span id="viz-mode" class="status-tag tag-accent">IDLE</span>
                </div>
                <div id="viz-canvas" class="viz-canvas">
                    <div class="canvas-placeholder">
                        <span class="placeholder-title">No Active Execution</span>
                        <span class="placeholder-sub">Click "Run Trace" to visualize runtime execution</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Playback Deck -->
        <footer class="playback-deck">
            <!-- <div class="playback-controls">
                <button id="btn-first" class="btn-deck" title="Jump to start (Home)">|◀</button>
                <button id="btn-prev" class="btn-deck" title="Previous step (Left Arrow)">◀</button>
                <button id="btn-play" class="btn-deck btn-deck-primary" title="Play/Pause (Space)">PLAY</button>
                <button id="btn-next" class="btn-deck" title="Next step (Right Arrow)">▶</button>
                <button id="btn-last" class="btn-deck" title="Jump to end (End)">▶|</button>
            </div> -->
            <div class="playback-controls">
                <button id="btn-first" class="btn-deck" title="Jump to start (Home)">|◀</button>
                <button id="btn-prev" class="btn-deck" title="Previous step (Left Arrow)">◀</button>
                <button id="btn-play" class="btn-deck btn-deck-primary" title="Play/Pause (Space)">PLAY</button>
                <button id="btn-next" class="btn-deck" title="Next step (Right Arrow)">▶</button>
                <button id="btn-last" class="btn-deck" title="Jump to end (End)">▶|</button>
                <span class="kbd-hint" title="Ctrl+Enter to trace | Arrow keys to step | Space to play">⌨</span>
            </div>

            <!-- Progress Scrubber -->
            <div class="scrubber-container">
                <input type="range" id="timeline-slider" class="scrubber-track" min="0" max="0" value="0">
            </div>

            <!-- Step Counter & Speed Control -->
            <div class="deck-meta">
                <span id="step-counter" class="step-counter">0 / 0</span>
                <select id="speed-select" class="speed-dropdown">
                    <option value="1200">0.5x</option>
                    <option value="600" selected>1.0x</option>
                    <option value="300">2.0x</option>
                    <option value="100">4.0x</option>
                </select>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="visualizer.js"></script>
    <script src="controls.js"></script>
</body>
</html>
