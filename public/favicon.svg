<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Charcoal Background Tile (#1E1E1E) -->
  <rect width="64" height="64" rx="14" fill="#1E1E1E"/>
  
  <!-- Stepped Call-Stack Execution Path (#FAF6F0 Cream, 6px stroke) -->
  <!-- starts at (14, 48), moves horizontally to (26, 48), vertically to (40, 32), then to (40, 18), and finally to (50, 18) -->
  <path d="M14 48 H26 V32 H40 V18 H50" 
        fill="none" 
        stroke="#FAF6F0" 
        stroke-width="6" 
        stroke-linecap="square" 
        stroke-linejoin="miter"/>
        
  <!-- Execution Start Node: Terracotta Square (#C85A32) -->
  <rect x="8" y="42" width="12" height="12" rx="2" fill="#C85A32"/>
  
  <!-- Active Stack Frame Node: Amber Square (#E09F3E) -->
  <rect x="44" y="12" width="12" height="12" rx="2" fill="#E09F3E"/>
</svg>